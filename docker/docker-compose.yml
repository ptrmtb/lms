version: "3.7"
name: lms
services:
  mariadb:
    image: mariadb:10.8
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MYSQL_ROOT_PASSWORD: 123
    volumes:
      - mariadb-data:/var/lib/mysql

  redis:
    image: redis:alpine

  frappe:
    image: frappe/bench:latest
    command: >
      bash -c "
      if [[ -d '/home/frappe/frappe-bench' ]]; then
        echo 'Bench already exists, skipping init';
        cd /home/frappe/frappe-bench && bench start;
      else
        echo 'Creating new bench...';
        export PATH=\"$${NVM_DIR}/versions/node/v$${NODE_VERSION_DEVELOP}/bin/:$${PATH}\";
        bench init --skip-redis-config-generation frappe-bench;
        cd frappe-bench;
        bench set-mariadb-host mariadb;
        bench set-redis-cache-host redis:6379;
        bench set-redis-queue-host redis:6379;
        bench set-redis-socketio-host redis:6379;
        sed -i '/redis/d' ./Procfile;
        sed -i '/watch/d' ./Procfile;
        bench get-app lms;
        bench new-site lms.localhost --force --mariadb-root-password 123 --admin-password admin --no-mariadb-socket;
        bench --site lms.localhost install-app lms;
        bench --site lms.localhost set-config developer_mode 1;
        bench --site lms.localhost clear-cache;
        bench use lms.localhost;
        bench start;
      fi"
    environment:
      - SHELL=/bin/bash
      - NODE_VERSION_DEVELOP=14  # Match your Frappe/ERPNext version
      - NVM_DIR=/home/frappe/.nvm
    working_dir: /home/frappe
    ports:
      - 8000:8000
      - 9000:9000
    depends_on:
      - mariadb
      - redis

volumes:
  mariadb-data:
